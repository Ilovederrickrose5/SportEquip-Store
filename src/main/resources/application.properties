# Server Configuration
server.port=8080

# Database Configuration
# 环境变量占位：本地默认 localhost，服务器通过 MYSQL_HOST=mysql 传入
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/sport_equipment?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.sportsequipment.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=false

# MyBatis Logging Level
logging.level.org.mybatis=INFO  

# JWT Configuration
sportsequipment.app.jwtSecret=ThisIsASecureJWTSecretKeyThatIsLongEnoughForHS512AlgorithmAndProvidesAdequateSecurityForTheApplication
sportsequipment.app.jwtExpirationMs=86400000
sportsequipment.app.accessTokenExpirationMs=900000
sportsequipment.app.refreshTokenExpirationMs=604800000

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.sportsequipment=INFO
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.com.zaxxer.hikari=INFO

# File Upload Configuration
# 环境变量占位：本地默认项目内 uploads 目录，服务器通过 UPLOAD_DIR=/app/uploads 传入
file.upload-dir=${UPLOAD_DIR:d:/CodeProjects/SportEquip-Store/uploads}
# 服务器通过 SERVER_URL 环境变量传入
server.url=${SERVER_URL:http://localhost:8080}
file.max-size=10485760

# CORS Configuration
# 环境变量占位：服务器通过 CORS_ORIGINS=http://139.199.78.188 传入
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Redis Configuration
# 环境变量占位：服务器通过 REDIS_HOST=redis 传入
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Redis 缓存配置
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false

# ==================== RabbitMQ 消息队列 ====================
# 环境变量占位：服务器通过 RABBITMQ_HOST=rabbitmq 传入
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5
spring.rabbitmq.listener.simple.prefetch=1

# 业务可配置参数
sportsequipment.mq.order-pending-ttl-ms=1800000
sportsequipment.mq.idempotent-ttl-seconds=86400