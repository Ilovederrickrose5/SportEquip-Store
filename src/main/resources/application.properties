# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sport_equipment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
# 指定Mapper XML文件位置
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类别名包，简化XML中的类型引用
mybatis.type-aliases-package=com.sportsequipment.entity
# 自动将下划线命名转换为驼峰命名
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=false

# MyBatis Logging Level
logging.level.org.mybatis=DEBUG

# JWT Configuration
sportsequipment.app.jwtSecret=ThisIsASecureJWTSecretKeyThatIsLongEnoughForHS512AlgorithmAndProvidesAdequateSecurityForTheApplication
# 保留旧字段做向后兼容，默认24小时
sportsequipment.app.jwtExpirationMs=86400000
# 双 token 机制：access_token 15分钟，refresh_token 7天
sportsequipment.app.accessTokenExpirationMs=900000
sportsequipment.app.refreshTokenExpirationMs=604800000

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.sportsequipment=INFO
# Disable specific warning about AuthenticationProvider configuration
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Database Connection Pool Logging
logging.level.com.zaxxer.hikari=INFO

# File Upload Configuration
file.upload-dir=d:/Users/30776/IdeaProjects/backend/uploads
server.url=http://localhost:8080
# 10MB (10485760 bytes)
file.max-size=10485760

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:5174

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# Redis 连接池配置
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Redis 缓存配置
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false

# ==================== RabbitMQ 消息队列（Docker 本地部署） ====================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
# 开启发送方 confirm：消息成功到达交换机就回调，失败能记日志
spring.rabbitmq.publisher-confirm-type=correlated
# 开启消息返回：路由不到队列时返给生产者，防消息丢
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# 消费者 ACK 模式：MANUAL 手动确认，业务处理成功才 basicAck，失败不重投递，进入后续兜底
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# 消费者并发 2-5，防止队列堆积；生产环境可上调
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5
# 每次预取 1 条，防止一个消费者积压
spring.rabbitmq.listener.simple.prefetch=1

# 业务可配置参数
# 未支付订单自动取消 TTL（毫秒），默认 30 分钟
sportsequipment.mq.order-pending-ttl-ms=1800000
# 幂等去重记录 TTL（秒），默认 24 小时，覆盖业务+延迟窗口
sportsequipment.mq.idempotent-ttl-seconds=86400
