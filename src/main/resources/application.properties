# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sport_equipment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
# 指定Mapper XML文件位置
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类别名包，简化XML中的类型引用
mybatis.type-aliases-package=com.sportsequipment.entity
# 自动将下划线命名转换为驼峰命名
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=false

# MyBatis Logging Level
logging.level.org.mybatis=DEBUG

# JWT Configuration
sportsequipment.app.jwtSecret=ThisIsASecureJWTSecretKeyThatIsLongEnoughForHS512AlgorithmAndProvidesAdequateSecurityForTheApplication
# 保留旧字段做向后兼容，默认24小时
sportsequipment.app.jwtExpirationMs=86400000
# 双 token 机制：access_token 15分钟，refresh_token 7天
sportsequipment.app.accessTokenExpirationMs=900000
sportsequipment.app.refreshTokenExpirationMs=604800000

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.sportsequipment=INFO
# Disable specific warning about AuthenticationProvider configuration
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Database Connection Pool Logging
logging.level.com.zaxxer.hikari=INFO

# File Upload Configuration
file.upload-dir=d:/Users/30776/IdeaProjects/backend/uploads
server.url=http://localhost:8080
# 10MB (10485760 bytes)
file.max-size=10485760

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:5174

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# Redis 连接池配置
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Redis 缓存配置
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
